[package]
name = "constraint-audio"
version = "0.1.0"
edition = "2021"
description = "Audio DSP backend for the constraint-theory ecosystem"
license = "MIT OR Apache-2.0"
keywords = ["audio", "dsp", "synthesizer", "lattice", "constraint"]
categories = ["multimedia::audio"]

[dependencies]
fundsp = "0.20"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
