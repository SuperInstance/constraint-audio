[package]
name = "constraint-audio"
version = "0.1.0"
edition = "2021"
description = "Audio DSP backend for the constraint-theory ecosystem — lattice oscillators, constraint filters, synth engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SuperInstance/constraint-audio"
homepage = "https://github.com/SuperInstance/constraint-audio"
readme = "README.md"
keywords = ["audio", "dsp", "synthesizer", "lattice", "constraint"]
categories = ["multimedia::audio"]
rust-version = "1.75"

[dependencies]
fundsp = "0.20"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
